name: DCSS HNS

on:
  push:
    branches: [master]
  pull_request: {}
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '기존 태그 (비우면 선택한 커밋)'
        type: string
        required: false
      publish:
        description: '빌드한 파일을 릴리즈에 게시'
        type: boolean
        default: true
      tests:
        description: '단위·클라우드·오프라인 실행 테스트도 수행'
        type: boolean
        default: false
      extended:
        description: '원본 전체 컴파일 조합·레거시 플랫폼도 검사'
        type: boolean
        default: false

permissions:
  contents: read

# PR의 이전 실행은 취소하고, 버전 순번을 정하는 master·릴리즈는 순서대로 실행합니다.
concurrency:
  group: hns-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && !inputs.publish && format('verify-{0}', github.run_id) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: 실행 계획
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tests: ${{ steps.plan.outputs.tests }}
      extended: ${{ steps.plan.outputs.extended }}
      linux: ${{ steps.plan.outputs.linux }}
      msvc: ${{ steps.plan.outputs.msvc }}
      desktop: ${{ steps.plan.outputs.desktop }}
      parallel: ${{ steps.plan.outputs.parallel }}
      standalone: ${{ steps.plan.outputs.standalone }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 변경 범위·버전·정확한 빌드 커밋 결정
        id: plan
        run: node .github/scripts/ci-plan.mjs

  checks:
    name: 코드·UI·클라우드 검사
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: 워크플로 문법·실행 조건 검사
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck=
          node --test .github/scripts/ci-*.test.mjs
          python3 -m unittest discover -s crawl-ref/source/wasm -p "test_*.py"
          node --test mobile/scripts/native-bundle.test.mjs
          if [[ -f mobile/scripts/windows-runtime.test.mjs ]]; then
            node --test mobile/scripts/windows-runtime.test.mjs
          fi
      - name: C++ 스타일 검사
        working-directory: crawl-ref/source
        run: |
          util/checkwhite -n
          util/unbrace -n
      - name: UI·클라우드 테스트
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:cloud-db

  client:
    name: WASM·웹 빌드
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HNS_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison pkg-config python3-yaml libncurses-dev libpng-dev libsqlite3-dev zlib1g-dev ccache
      - name: Install UI dependencies
        run: npm ci
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: ${{ runner.os }}-emsdk-5.0.7-v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: hns-client-emscripten-5.0.7
          max-size: 1G
          create-symlink: true
      - name: Install Emscripten 5.0.7
        run: |
          if [[ ! -d "$RUNNER_TEMP/emsdk/.git" ]]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          fi
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.7
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.7
      - name: Build this repository's HNS engine and tiles
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          JOBS=4 npm run build:engine
        env:
          EM_COMPILER_WRAPPER: ccache
      - name: Build UI
        run: npm run build
      - name: Verify offline play
        if: needs.plan.outputs.tests == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:bundled-web
      - name: Package complete corresponding source
        run: npm run package:source
      - name: Upload test evidence
        if: ${{ !cancelled() && needs.plan.outputs.tests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          retention-days: 7
          path: mobile/test-results/
          if-no-files-found: ignore
      - name: Share web assets with Android
        uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-web-input
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Share engine version with desktop (without WASM)
        uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-native-input
          path: mobile/dist/offline/version.json
          if-no-files-found: error
          retention-days: 7
      - name: Share real save for optional desktop tests
        if: needs.plan.outputs.tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-test-save
          path: mobile/test-results/offline-backup.pzsave
          if-no-files-found: error
          retention-days: 7
      - name: Upload complete corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-source
          path: mobile/android/app/build/outputs/source/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Android APK
    needs:
      - plan
      - client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HNS_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dcss-hns-web-input
          path: mobile/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build APK from the web assets
        working-directory: mobile/android
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon :app:assembleDebug ${{ needs.plan.outputs.tests == 'true' && ':app:lintDebug' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-mobile-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    name: SDL compile ${{ matrix.platform }} ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.parallel == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HNS_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop) }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Install native engine build dependencies
        if: runner.os != 'Windows'
        run: python -m pip install pyyaml
      - name: Install Linux SDL and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          python ../.github/workflows/deps.py --build-opts TILES=1 --appimage
          echo 'LINUXDEPLOY=/tmp/linuxdeploy-x86_64.AppImage' >> "$GITHUB_ENV"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: base-devel zip mingw-w64-x86_64-toolchain mingw-w64-x86_64-python-yaml mingw-w64-x86_64-pkgconf mingw-w64-x86_64-curl
      - name: Cache native compilation
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: hns-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          max-size: 1G
          create-symlink: true
      - name: Compile original SDL engine (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          HNS_DESKTOP_PLATFORM: ${{ matrix.platform }}
          HNS_DESKTOP_ARCH: ${{ matrix.arch }}
        run: node scripts/build-sdl.mjs ${{ needs.plan.outputs.tests == 'true' && '--verify' || '' }}
      - name: Compile original SDL engine
        if: runner.os != 'Windows'
        env:
          HNS_DESKTOP_PLATFORM: ${{ matrix.platform }}
          HNS_DESKTOP_ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/build-sdl.mjs ${{ needs.plan.outputs.tests == 'true' && '--verify' || '' }}
      - name: Archive native files with executable modes and symlinks
        run: tar -czf "build/native-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C build/sdl native
      - name: Verify standalone save backend (Windows, optional)
        if: needs.plan.outputs.tests == 'true' && needs.plan.outputs.standalone == 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: node scripts/test-native-backend.mjs
      - name: Verify standalone save backend (optional)
        if: needs.plan.outputs.tests == 'true' && needs.plan.outputs.standalone == 'true' && runner.os != 'Windows'
        run: node scripts/test-native-backend.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hns-sdl-${{ matrix.platform }}-${{ matrix.arch }}
          path: mobile/build/native-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    needs:
      - plan
      - client
      - native
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && needs.client.result == 'success' && (needs.plan.outputs.parallel != 'true' || needs.native.result == 'success') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HNS_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop) }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          submodules: ${{ needs.plan.outputs.parallel != 'true' && 'recursive' || 'false' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: hns-sdl-${{ matrix.platform }}-${{ matrix.arch }}
          path: mobile/build/native-input
        if: needs.plan.outputs.parallel == 'true'
      - name: Restore the compiled SDL engine
        run: |
          mkdir -p build/sdl
          tar -xzf "build/native-input/native-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C build/sdl
        if: needs.plan.outputs.parallel == 'true'
      - uses: actions/download-artifact@v4
        with:
          name: dcss-hns-native-input
          path: mobile/dist/offline
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.tests == 'true'
        with:
          name: dcss-hns-test-save
          path: mobile/test-results
      - name: Install desktop dependencies
        if: needs.plan.outputs.tests == 'true' || needs.plan.outputs.standalone != 'true'
        run: npm ci
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.parallel != 'true' && (runner.os != 'Windows')
        with:
          python-version: '3.12'
        name: 'Legacy tag: Python'
      - name: 'Legacy tag: Install native engine build dependencies'
        if: needs.plan.outputs.parallel != 'true' && (runner.os != 'Windows')
        run: python -m pip install pyyaml
      - name: 'Legacy tag: Install Linux SDL and packaging dependencies'
        if: needs.plan.outputs.parallel != 'true' && (runner.os == 'Linux')
        run: |
          python ../.github/workflows/deps.py --build-opts TILES=1 --appimage
          echo 'LINUXDEPLOY=/tmp/linuxdeploy-x86_64.AppImage' >> "$GITHUB_ENV"
      - name: 'Legacy tag: Cache native compilation'
        if: needs.plan.outputs.parallel != 'true' && (runner.os != 'Windows')
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: hns-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          max-size: 1G
          create-symlink: true
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: ${{ needs.plan.outputs.parallel != 'true' }}
          install: ${{ needs.plan.outputs.parallel == 'true' && 'mingw-w64-x86_64-python' || 'base-devel zip mingw-w64-x86_64-toolchain mingw-w64-x86_64-python-yaml mingw-w64-x86_64-pkgconf mingw-w64-x86_64-curl' }}
      - name: Package Windows client with original SDL engine
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          HNS_DESKTOP_PLATFORM: ${{ matrix.platform }}
          HNS_DESKTOP_ARCH: ${{ matrix.arch }}
        run: node scripts/build-desktop.mjs ${{ needs.plan.outputs.parallel == 'true' && '--prebuilt-native' || '' }}
      - name: Package desktop app and archive
        if: runner.os != 'Windows'
        env:
          HNS_DESKTOP_PLATFORM: ${{ matrix.platform }}
          HNS_DESKTOP_ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/build-desktop.mjs ${{ needs.plan.outputs.parallel == 'true' && '--prebuilt-native' || '' }}
      - name: Install Linux runtime dependencies
        if: needs.plan.outputs.tests == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Verify desktop offline play
        if: needs.plan.outputs.tests == 'true'
        env:
          HNS_DESKTOP_EXECUTABLE: ${{ github.workspace }}/mobile/build/desktop/DCSS HNS-${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:desktop
          else
            npm run test:desktop
          fi
      - name: Upload desktop test evidence
        if: ${{ !cancelled() && needs.plan.outputs.tests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: mobile/test-results/native-menu/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload desktop archive
        uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            mobile/build/desktop/*.zip
            mobile/build/desktop/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  engine:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_opts }} ${{ matrix.debug }} ${{ matrix.build_all }} tag_upgrade=${{ matrix.tag_upgrade }}
    needs:
      - plan
      - checks
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      FORCE_CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install generator dependencies
        run: python -m pip install pyyaml
        working-directory: crawl-ref/source
      - name: Install dependencies
        run: ./deps.py --compiler ${{ matrix.compiler }} --build-opts "${{ matrix.build_opts }}" --debug-opts "${{ matrix.debug }}"
        working-directory: .github/workflows
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ matrix.compiler }}-${{ matrix.tag_upgrade }}-${{ matrix.build_opts }}-${{ matrix.debug }}-${{ matrix.build_all }}
          restore-keys: |
            linux-${{ matrix.compiler }}-${{ matrix.tag_upgrade }}-${{ matrix.build_opts }}-${{ matrix.debug }}-${{ matrix.build_all }}
            linux-${{ matrix.compiler }}-${{ matrix.tag_upgrade }}-${{ matrix.build_opts }}-${{ matrix.debug }}
            linux-${{ matrix.compiler }}-${{ matrix.tag_upgrade }}-${{ matrix.build_opts }}
            linux-${{ matrix.compiler }}-${{ matrix.tag_upgrade }}
            linux-${{ matrix.compiler }}
      - name: 'Setup ccache: prepend path'
        run: echo /usr/lib/ccache >> $GITHUB_PATH
      - name: 'Setup ccache: update symlinks'
        run: /usr/sbin/update-ccache-symlinks
      - name: Run tag upgrade scripts
        if: matrix.tag_upgrade == true
        run: |
          if ! grep -q '#define TAG_MAJOR_VERSION 34' tag-version.h ; then
            echo "::error ::CI job for TAG_MAJOR_VERSION testing needs to be updated for new major tag"
            exit 1
          fi
          sed -i'' -e 's/^#define TAG_MAJOR_VERSION 34$/#define TAG_MAJOR_VERSION 35/' tag-version.h
          util/tag-major-upgrade -t 35
          util/tag-35-upgrade.py
        working-directory: crawl-ref/source
      - run: make -j$(nproc) ${{ matrix.build_opts }} ${{ matrix.debug }} ${{ matrix.build_all }}
        working-directory: crawl-ref/source
      - if: matrix.debug == 'FULLDEBUG=1' && (matrix.build_opts == '' || matrix.build_opts == 'WEBTILES=1') && matrix.tag_upgrade == false
        id: tests
        run: |
          # allow Ubuntu to make core dumps, and ensure that apport doesn't send them to Canonical
          ulimit -c unlimited
          sudo sh -c 'echo core > /proc/sys/kernel/core_pattern'
          make -j$(nproc) ${{ matrix.build_opts }} ${{ matrix.debug }} ${{ matrix.build_all }} test
        working-directory: crawl-ref/source
        env:
          TERM: dumb
      - if: failure() && steps.tests.conclusion == 'failure' && hashFiles('crawl-ref/source/core') != ''
        uses: actions/upload-artifact@v4
        with:
          name: morgue-${{ matrix.compiler }}-${{ matrix.build_opts }}
          retention-days: 7
          path: |
            crawl-ref/source/morgue
            crawl-ref/source/saves/*.cs
            crawl-ref/source/crawl
            crawl-ref/source/core

  msvc:
    name: msvc ${{ matrix.build_type }} ${{ matrix.build_arch }}
    needs:
      - plan
      - checks
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.msvc) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
      - name: Install pyyaml
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
        working-directory: crawl-ref/source
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build
        run: |
          msbuild /maxCpuCount /property:Configuration="${{ matrix.build_type }}" /p:Platform=${{ matrix.build_arch }} crawl-ref.sln
        working-directory: crawl-ref/source/MSVC

  catch2:
    name: C++ unit tests (Catch2)
    needs:
      - plan
      - checks
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install generator dependencies
        run: python -m pip install pyyaml
        working-directory: crawl-ref/source
      - name: Install dependencies
        run: ./deps.py --coverage --build-opts TILES=1
        working-directory: .github/workflows
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: catch2
          restore-keys: |
            catch2
      - name: 'Setup ccache: prepend path'
        run: echo /usr/lib/ccache >> $GITHUB_PATH
      - name: 'Setup ccache: update symlinks'
        run: /usr/sbin/update-ccache-symlinks
      - run: make -j$(nproc) catch2-tests TILES=1
        working-directory: crawl-ref/source

  headers:
    name: Build headers ${{ matrix.compiler }} ${{ matrix.build_opts }} ${{ matrix.debug }}
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      FORCE_CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    strategy:
      matrix:
        compiler:
          - gcc
          - clang
        build_opts:
          - ''
          - WEBTILES=1
          - TILES=1
        debug:
          - ''
          - FULLDEBUG=1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install generator dependencies
        run: python -m pip install pyyaml
        working-directory: crawl-ref/source
      - name: Install dependencies
        run: ./deps.py --compiler ${{ matrix.compiler }} --build-opts "${{ matrix.build_opts }}" --debug-opts "${{ matrix.debug }}"
        working-directory: .github/workflows
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-headers-${{ matrix.compiler }}-${{ matrix.build_opts }}-${{ matrix.debug }}
          restore-keys: |
            build-headers-${{ matrix.compiler }}-${{ matrix.build_opts }}-${{ matrix.debug }}
            build-headers-${{ matrix.compiler }}-${{ matrix.build_opts }}
            build-headers-${{ matrix.compiler }}
            build-headers
      - name: 'Setup ccache: prepend path'
        run: echo /usr/lib/ccache >> $GITHUB_PATH
      - name: 'Setup ccache: update symlinks'
        run: /usr/sbin/update-ccache-symlinks
      - run: make -j$(nproc) ${{ matrix.build_opts }} ${{ matrix.debug }} header-build-tests
        working-directory: crawl-ref/source

  universal:
    name: macOS ${{ matrix.build_type }}
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        build_type:
          - tiles-universal
          - console-universal
        build_opts:
          - ''
          - TILES=y
        exclude:
          - build_type: tiles-universal
            build_opts: ''
          - build_type: console-universal
            build_opts: TILES=y
      fail-fast: false
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.13.1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
      - name: Python install bug workaround
        run: |
          find /usr/local/bin -type l -exec sh -c 'readlink -f "$1" \
          | grep -q ^/Library/Frameworks/Python.framework/Versions/' _ {} \; -exec rm -v {} \;
      - name: Install pyyaml
        run: pip3 install pyyaml --break-system-packages --user
      - name: diagnostic
        run: |
          echo $PATH
          which python
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-clang-${{ matrix.build_type }}
          restore-keys: |
            macos-clang-${{ matrix.build_type }}
            macos-clang
      - name: 'Setup ccache: prepend path'
        run: echo $(brew --prefix)/opt/ccache/libexec >> $GITHUB_PATH
      - run: make -j$(sysctl -n hw.ncpu) mac-app-${{ matrix.build_type }} ${{matrix.build_opts }}
        working-directory: crawl-ref/source

  mingw:
    name: mingw64 ${{ matrix.build_type }}
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        build_type:
          - tiles
          - console
          - installer
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
          submodules: recursive
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install generator dependencies
        run: python -m pip install pyyaml
        working-directory: crawl-ref/source
      - name: Install dependencies
        run: ./deps.py --crosscompile
        working-directory: .github/workflows
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: key2-mingw64-${{ matrix.build_type }}
          restore-keys: |
            key2-mingw64-${{ matrix.build_type }}
            key2-mingw64
      - name: 'Setup ccache: prepend path'
        run: echo /usr/lib/ccache >> $GITHUB_PATH
      - name: 'Setup ccache: update symlinks'
        run: /usr/sbin/update-ccache-symlinks
      - run: make -j$(nproc) CROSSHOST=i686-w64-mingw32 package-windows-${{ matrix.build_type }}
        working-directory: crawl-ref/source

  legacy_android:
    name: Android
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_CCACHE: ccache
    strategy:
      matrix:
        build_opts:
          - ANDROID=1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ needs.plan.outputs.sha }}
      - name: Install dependencies
        run: ./deps.py --build-opts "${{ matrix.build_opts }}"
        working-directory: .github/workflows
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.5.0
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android
          restore-keys: |
            android
      - name: 'Setup ccache: extra configuration'
        run: ccache --set-config compiler_check=content
      - name: 'Setup ccache: prepend path'
        run: echo /usr/lib/ccache >> $GITHUB_PATH
      - name: 'Setup ccache: update symlinks'
        run: /usr/sbin/update-ccache-symlinks
      - name: Prepare Android build
        run: make -j$(nproc) ${{ matrix.build_opts }} android
        working-directory: crawl-ref/source
      - name: Build with Gradle
        run: gradle :app:assembleBuildTest
        working-directory: crawl-ref/source/android-project

  webserver:
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version:
          - 3.8
          - 3.11
          - 3.13
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (py3)
        working-directory: crawl-ref/source/webserver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.py3.txt
      - name: Lint (flake8)
        working-directory: crawl-ref/source/webserver
        run: make lint
      - name: Unit Tests (pytest)
        working-directory: crawl-ref/source/webserver
        run: pytest
      - name: Unit Tests (unittest)
        working-directory: crawl-ref/source/webserver
        run: python -m unittest webtiles.userdb

  monster:
    name: Build monster ${{ matrix.compiler }}
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
      FORCE_CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
    strategy:
      matrix:
        compiler:
          - gcc
          - clang
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install generator dependencies
        run: python -m pip install pyyaml
        working-directory: crawl-ref/source
      - name: Install dependencies
        run: ./deps.py --compiler ${{ matrix.compiler }}
        working-directory: .github/workflows
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-monster-${{ matrix.compiler }}
          restore-keys: |
            build-monster-${{ matrix.compiler }}
            build-monster
      - name: 'Setup ccache: prepend path'
        run: echo /usr/lib/ccache >> $GITHUB_PATH
      - name: 'Setup ccache: update symlinks'
        run: /usr/sbin/update-ccache-symlinks
      - run: make -j$(nproc) monster
        working-directory: crawl-ref/source

  docs:
    name: Build docs
    needs:
      - plan
      - checks
    if: needs.plan.outputs.extended == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Generate non-Lua docs
        run: make -j$(nproc) docs
        working-directory: crawl-ref/source
      - name: Lua LDoc
        uses: lunarmodules/ldoc@v1.5.0
        with:
          args: --config crawl-ref/source/util/config.ld --dir $GITHUB_WORKSPACE/crawl-ref/docs/lua/ .
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: crawl-ref/docs/

  result:
    name: 전체 결과
    needs:
      - plan
      - checks
      - client
      - android
      - native
      - desktop
      - engine
      - msvc
      - catch2
      - headers
      - universal
      - mingw
      - legacy_android
      - webserver
      - monster
      - docs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Summarize all stages and reject incomplete builds
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-result.mjs

  publish:
    name: 빌드한 파일 릴리즈
    needs:
      - plan
      - result
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.result.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dcss-hns-desktop-*
          path: artifacts/desktop
      - uses: actions/download-artifact@v4
        with:
          name: dcss-hns-mobile-android
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: dcss-hns-source
          path: artifacts/source
      - name: Collect complete release and checksums
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python3 .github/scripts/collect-release.py artifacts release-assets
      - name: Publish the files built in this run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "DCSS HNS $RELEASE_VERSION" \
              --generate-notes --latest
          fi
