name: Platform Release

on:
  workflow_run:
    workflows: [Build]
    branches: [master]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (leave empty to release the selected branch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: platform-release
  cancel-in-progress: false

jobs:
  release_ref:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.release.tag_name || inputs.tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the release tag and exact source commit
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node .github/scripts/resolve-release.mjs

  android:
    needs: release_ref
    uses: ./.github/workflows/mobile.yml
    with:
      ref: ${{ needs.release_ref.outputs.sha }}
      version: ${{ needs.release_ref.outputs.version }}

  desktop:
    needs: [release_ref, android]
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HNS_RELEASE_VERSION: ${{ needs.release_ref.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            arch: x64
            executable: DCSS HNS.exe
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            executable: DCSS HNS
          - os: macos-15-intel
            platform: darwin
            arch: x64
            executable: DCSS HNS.app/Contents/MacOS/DCSS HNS
          - os: macos-15
            platform: darwin
            arch: arm64
            executable: DCSS HNS.app/Contents/MacOS/DCSS HNS
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_ref.outputs.sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dcss-hns-client-input
          path: mobile
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Install native engine build dependencies
        if: runner.os != 'Windows'
        run: python -m pip install pyyaml
      - name: Install Linux SDL and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          python ../.github/workflows/deps.py --build-opts TILES=1 --appimage
          echo 'LINUXDEPLOY=/tmp/linuxdeploy-x86_64.AppImage' >> "$GITHUB_ENV"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            base-devel zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python-yaml
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-advancecomp
      - name: Package Windows client with original SDL engine
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          HNS_DESKTOP_PLATFORM: ${{ matrix.platform }}
          HNS_DESKTOP_ARCH: ${{ matrix.arch }}
        run: node scripts/build-desktop.mjs
      # Keep the tested management UI; gameplay uses the native SDL engine.
      - name: Package desktop app and archive
        if: runner.os != 'Windows'
        env:
          HNS_DESKTOP_PLATFORM: ${{ matrix.platform }}
          HNS_DESKTOP_ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node scripts/build-desktop.mjs
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Verify desktop offline play
        env:
          HNS_DESKTOP_EXECUTABLE: ${{ github.workspace }}/mobile/build/desktop/DCSS HNS-${{ matrix.platform }}-${{ matrix.arch }}/${{ matrix.executable }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a npm run test:desktop
          else
            npm run test:desktop
          fi
      - name: Upload desktop archive
        uses: actions/upload-artifact@v4
        with:
          name: dcss-hns-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            mobile/build/desktop/*.zip
            mobile/build/desktop/*.tar.gz
          if-no-files-found: error

  upload:
    needs: [release_ref, android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_ref.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dcss-hns-desktop-*
          path: artifacts/desktop
      - uses: actions/download-artifact@v4
        with:
          name: dcss-hns-mobile-android
          path: artifacts/android
      - name: Collect platform files, corresponding source and checksums
        env:
          RELEASE_TAG: ${{ needs.release_ref.outputs.tag }}
        run: python3 .github/scripts/collect-release.py artifacts release-assets
      - name: Publish the complete release or update its files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_ref.outputs.tag }}
          RELEASE_SHA: ${{ needs.release_ref.outputs.sha }}
          RELEASE_VERSION: ${{ needs.release_ref.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_SHA" \
              --title "DCSS HNS $RELEASE_VERSION" \
              --generate-notes --latest
          fi
